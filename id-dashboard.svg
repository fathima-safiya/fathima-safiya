<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#1a1c29" />
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(244, 114, 182, 0)" />
    </linearGradient>
    <style>
      .text { font-family: 'Inter', system-ui, sans-serif; fill: white; }
      @keyframes swing {
        0% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
        100% { transform: rotate(-5deg); }
      }
      .badge-group {
        transform-origin: 200px -50px;
        animation: swing 4s ease-in-out infinite;
      }
      @keyframes holo-sweep {
        0% { transform: translate(-150px, -150px); }
        100% { transform: translate(300px, 300px); }
      }
      .holo-shine {
        animation: holo-sweep 4s linear infinite;
      }
      @keyframes countUp { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 20; } }
      .chart-bar { stroke-dasharray: 100; stroke-dashoffset: 100; animation: countUp 1.5s ease-out forwards; }
    </style>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="url(#bg)" />
  <rect width="798" height="398" x="1" y="1" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.3" />

  <!-- Lanyard String -->
  <path d="M200, -50 L200, 50" stroke="#a78bfa" stroke-width="4" />

  <!-- Swinging ID Badge -->
  <g class="badge-group">
    <!-- Clip hole -->
    <rect x="180" y="45" width="40" height="10" rx="5" fill="#333" />
    
    <!-- Badge Body -->
    <rect x="120" y="60" width="160" height="240" rx="10" fill="#1e2133" stroke="#4a5568" stroke-width="2" />
    
    <!-- Holographic Overlay Mask -->
    <clipPath id="badge-clip">
      <rect x="120" y="60" width="160" height="240" rx="10" />
    </clipPath>
    <rect x="120" y="60" width="160" height="240" rx="10" fill="none" />
    <g clip-path="url(#badge-clip)">
      <rect class="holo-shine" x="120" y="60" width="200" height="300" fill="url(#holo)" transform="rotate(45)" />
    </g>

    <!-- Portrait Placeholder -->
    <circle cx="200" cy="130" r="40" fill="#2d3748" stroke="#22d3ee" stroke-width="3" />
    <!-- Small silhouette -->
    <circle cx="200" cy="120" r="15" fill="#a0aec0" />
    <path d="M175,160 Q200,140 225,160 L225,180 L175,180 Z" fill="#a0aec0" />

    <!-- Name and Details -->
    <text x="200" y="195" class="text" font-size="16" font-weight="bold" text-anchor="middle">Fathima Safiya</text>
    <text x="200" y="215" class="text" font-size="12" fill="#94a3b8" text-anchor="middle">Full-Stack Dev</text>
    
    <!-- Fake Barcode -->
    <rect x="140" y="240" width="5" height="40" fill="#cbd5e1" />
    <rect x="150" y="240" width="2" height="40" fill="#cbd5e1" />
    <rect x="155" y="240" width="8" height="40" fill="#cbd5e1" />
    <rect x="168" y="240" width="3" height="40" fill="#cbd5e1" />
    <rect x="175" y="240" width="7" height="40" fill="#cbd5e1" />
    <rect x="185" y="240" width="4" height="40" fill="#cbd5e1" />
    <rect x="195" y="240" width="2" height="40" fill="#cbd5e1" />
    <rect x="200" y="240" width="6" height="40" fill="#cbd5e1" />
    <rect x="210" y="240" width="3" height="40" fill="#cbd5e1" />
    <rect x="215" y="240" width="7" height="40" fill="#cbd5e1" />
    <rect x="225" y="240" width="5" height="40" fill="#cbd5e1" />
    <rect x="235" y="240" width="4" height="40" fill="#cbd5e1" />
    <rect x="242" y="240" width="6" height="40" fill="#cbd5e1" />
    <rect x="250" y="240" width="3" height="40" fill="#cbd5e1" />
  </g>

  <!-- Dashboard Side -->
  <g transform="translate(350, 60)">
    <text x="0" y="0" class="text" font-size="22" font-weight="700">Live Dashboard</text>
    
    <!-- KPI 1 -->
    <rect x="0" y="30" width="120" height="80" rx="10" fill="#1e2133" />
    <text x="15" y="55" class="text" font-size="12" fill="#94a3b8">Repositories</text>
    <text x="15" y="90" class="text" font-size="32" font-weight="bold" fill="#22d3ee">34</text>

    <!-- KPI 2 -->
    <rect x="140" y="30" width="120" height="80" rx="10" fill="#1e2133" />
    <text x="155" y="55" class="text" font-size="12" fill="#94a3b8">Contributions</text>
    <text x="155" y="90" class="text" font-size="32" font-weight="bold" fill="#a78bfa">942</text>

    <!-- KPI 3 -->
    <rect x="280" y="30" width="120" height="80" rx="10" fill="#1e2133" />
    <text x="295" y="55" class="text" font-size="12" fill="#94a3b8">Cups of Coffee</text>
    <text x="295" y="90" class="text" font-size="32" font-weight="bold" fill="#f472b6">1.2k</text>

    <!-- Activity Bar Chart -->
    <text x="0" y="150" class="text" font-size="16" font-weight="600">Weekly Commits</text>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#4a5568" stroke-width="2" />
    
    <g transform="translate(20, 160)">
      <line class="chart-bar" x1="10" y1="80" x2="10" y2="0" stroke="#22d3ee" stroke-width="20" stroke-linecap="round" />
      <line class="chart-bar" x1="60" y1="80" x2="60" y2="30" stroke="#a78bfa" stroke-width="20" stroke-linecap="round" style="animation-delay: 0.2s;" />
      <line class="chart-bar" x1="110" y1="80" x2="110" y2="50" stroke="#f472b6" stroke-width="20" stroke-linecap="round" style="animation-delay: 0.4s;" />
      <line class="chart-bar" x1="160" y1="80" x2="160" y2="10" stroke="#22d3ee" stroke-width="20" stroke-linecap="round" style="animation-delay: 0.6s;" />
      <line class="chart-bar" x1="210" y1="80" x2="210" y2="40" stroke="#a78bfa" stroke-width="20" stroke-linecap="round" style="animation-delay: 0.8s;" />
      <line class="chart-bar" x1="260" y1="80" x2="260" y2="20" stroke="#f472b6" stroke-width="20" stroke-linecap="round" style="animation-delay: 1.0s;" />
      <line class="chart-bar" x1="310" y1="80" x2="310" y2="60" stroke="#22d3ee" stroke-width="20" stroke-linecap="round" style="animation-delay: 1.2s;" />
      
      <!-- Labels -->
      <text x="10" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">M</text>
      <text x="60" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">T</text>
      <text x="110" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">W</text>
      <text x="160" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">T</text>
      <text x="210" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">F</text>
      <text x="260" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">S</text>
      <text x="310" y="100" class="text" font-size="10" fill="#94a3b8" text-anchor="middle">S</text>
    </g>
  </g>
</svg>
