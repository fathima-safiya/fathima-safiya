<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#1a1c29" />
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(244, 114, 182, 0)" />
    </linearGradient>
    <style>
      .text { font-family: 'Inter', system-ui, sans-serif; fill: white; }
      @keyframes swing {
        0% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
        100% { transform: rotate(-5deg); }
      }
      .badge-group {
        transform-origin: 400px -50px;
        animation: swing 4s ease-in-out infinite;
      }
      @keyframes holo-sweep {
        0% { transform: translate(-150px, -150px); }
        100% { transform: translate(300px, 300px); }
      }
      .holo-shine {
        animation: holo-sweep 4s linear infinite;
      }
    </style>
    <!-- Clip path to make the avatar a perfect circle -->
    <clipPath id="avatar-clip">
      <circle cx="200" cy="130" r="40" />
    </clipPath>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="url(#bg)" />
  <rect width="798" height="398" x="1" y="1" rx="15" fill="none" stroke="#22d3ee" stroke-opacity="0.3" />

  <g transform="translate(200, 0)">
    <!-- Lanyard String -->
    <path d="M200, -50 L200, 50" stroke="#a78bfa" stroke-width="4" />

    <!-- Swinging ID Badge -->
    <g class="badge-group">
      <!-- Clip hole -->
      <rect x="180" y="45" width="40" height="10" rx="5" fill="#333" />
      
      <!-- Badge Body -->
      <rect x="120" y="60" width="160" height="240" rx="10" fill="#1e2133" stroke="#4a5568" stroke-width="2" />
      
      <!-- Holographic Overlay Mask -->
      <clipPath id="badge-clip">
        <rect x="120" y="60" width="160" height="240" rx="10" />
      </clipPath>
      <rect x="120" y="60" width="160" height="240" rx="10" fill="none" />
      <g clip-path="url(#badge-clip)">
        <rect class="holo-shine" x="120" y="60" width="200" height="300" fill="url(#holo)" transform="rotate(45)" />
      </g>

      <!-- The Avatar Image (using your GitHub Profile Picture) -->
      <circle cx="200" cy="130" r="42" fill="none" stroke="#22d3ee" stroke-width="3" />
      <image x="160" y="90" width="80" height="80" href="https://avatars.githubusercontent.com/u/326454727?v=4" xlink:href="https://avatars.githubusercontent.com/u/326454727?v=4" clip-path="url(#avatar-clip)" />

      <!-- Name and Details -->
      <text x="200" y="195" class="text" font-size="16" font-weight="bold" text-anchor="middle">Fathima Safiya</text>
      <text x="200" y="215" class="text" font-size="12" fill="#94a3b8" text-anchor="middle">Full-Stack Dev</text>
      
      <!-- Fake Barcode -->
      <rect x="140" y="240" width="5" height="40" fill="#cbd5e1" />
      <rect x="150" y="240" width="2" height="40" fill="#cbd5e1" />
      <rect x="155" y="240" width="8" height="40" fill="#cbd5e1" />
      <rect x="168" y="240" width="3" height="40" fill="#cbd5e1" />
      <rect x="175" y="240" width="7" height="40" fill="#cbd5e1" />
      <rect x="185" y="240" width="4" height="40" fill="#cbd5e1" />
      <rect x="195" y="240" width="2" height="40" fill="#cbd5e1" />
      <rect x="200" y="240" width="6" height="40" fill="#cbd5e1" />
      <rect x="210" y="240" width="3" height="40" fill="#cbd5e1" />
      <rect x="215" y="240" width="7" height="40" fill="#cbd5e1" />
      <rect x="225" y="240" width="5" height="40" fill="#cbd5e1" />
      <rect x="235" y="240" width="4" height="40" fill="#cbd5e1" />
      <rect x="242" y="240" width="6" height="40" fill="#cbd5e1" />
      <rect x="250" y="240" width="3" height="40" fill="#cbd5e1" />
    </g>
  </g>
</svg>
