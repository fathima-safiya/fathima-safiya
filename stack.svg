<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#1a1c29" />
    </linearGradient>
    <style>
      .text { font-family: 'Inter', system-ui, sans-serif; fill: white; }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .orbit-1 { transform-origin: 400px 200px; animation: orbit 20s linear infinite; }
      .orbit-2 { transform-origin: 400px 200px; animation: orbit 30s linear infinite reverse; }
      .orbit-3 { transform-origin: 400px 200px; animation: orbit 40s linear infinite; }
      .counter-rotate-1 { animation: orbit 20s linear infinite reverse; }
      .counter-rotate-2 { animation: orbit 30s linear infinite; }
      .counter-rotate-3 { animation: orbit 40s linear infinite reverse; }
    </style>
  </defs>
  <rect width="800" height="400" rx="15" fill="url(#bg)" />
  <rect width="798" height="398" x="1" y="1" rx="15" fill="none" stroke="#a78bfa" stroke-opacity="0.3" />
  
  <text x="400" y="50" class="text" font-size="24" font-weight="700" text-anchor="middle">Tech Orbit</text>
  
  <circle cx="400" cy="200" r="40" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="2"/>
  <text x="400" y="206" class="text" font-size="16" font-weight="bold" text-anchor="middle" fill="#22d3ee">DEV</text>

  <ellipse cx="400" cy="200" rx="120" ry="120" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
  <g class="orbit-1">
    <g transform="translate(400, 80)">
      <circle class="counter-rotate-1" cx="0" cy="0" r="20" fill="#282c34" stroke="#61dafb" stroke-width="2"/>
      <text class="counter-rotate-1 text" x="0" y="5" font-size="10" text-anchor="middle">React</text>
    </g>
    <g transform="translate(400, 320)">
      <circle class="counter-rotate-1" cx="0" cy="0" r="20" fill="#3178c6" stroke="#fff" stroke-width="2"/>
      <text class="counter-rotate-1 text" x="0" y="5" font-size="10" text-anchor="middle">TS</text>
    </g>
  </g>

  <ellipse cx="400" cy="200" rx="180" ry="180" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4"/>
  <g class="orbit-2">
    <g transform="translate(580, 200)">
      <circle class="counter-rotate-2" cx="0" cy="0" r="20" fill="#4f5d95" stroke="#fff" stroke-width="2"/>
      <text class="counter-rotate-2 text" x="0" y="5" font-size="10" text-anchor="middle">PHP</text>
    </g>
    <g transform="translate(220, 200)">
      <circle class="counter-rotate-2" cx="0" cy="0" r="20" fill="#f89820" stroke="#fff" stroke-width="2"/>
      <text class="counter-rotate-2 text" x="0" y="5" font-size="10" text-anchor="middle">Java</text>
    </g>
  </g>

  <ellipse cx="400" cy="200" rx="240" ry="100" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4" transform="rotate(30 400 200)"/>
  <g class="orbit-3">
    <g transform="translate(640, 200)">
      <circle class="counter-rotate-3" cx="0" cy="0" r="20" fill="#FFCA28" stroke="#fff" stroke-width="2"/>
      <text class="counter-rotate-3 text" x="0" y="5" font-size="10" text-anchor="middle" fill="#000">Firebase</text>
    </g>
    <g transform="translate(160, 200)">
      <circle class="counter-rotate-3" cx="0" cy="0" r="20" fill="#4479A1" stroke="#fff" stroke-width="2"/>
      <text class="counter-rotate-3 text" x="0" y="5" font-size="10" text-anchor="middle">MySQL</text>
    </g>
  </g>
</svg>
