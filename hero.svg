<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e16" />
      <stop offset="100%" stop-color="#1a1c29" />
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <style>
      .text { font-family: 'Inter', system-ui, sans-serif; fill: white; }
      .title { font-size: 48px; font-weight: 800; fill: url(#aurora); }
      .subtitle { font-size: 24px; font-weight: 600; fill: #94a3b8; }
      .pill { fill: rgba(34, 211, 238, 0.1); stroke: #22d3ee; stroke-width: 1; rx: 15; }
      @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
      .dot { animation: pulse 2s infinite; fill: #22d3ee; }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-1 { animation: slideUp 0.8s ease forwards; }
      .animate-2 { animation: slideUp 0.8s ease 0.2s forwards; opacity: 0; }
      .animate-3 { animation: slideUp 0.8s ease 0.4s forwards; opacity: 0; }
    </style>
  </defs>
  <rect width="800" height="300" rx="15" fill="url(#bg)" />
  <rect width="798" height="298" x="1" y="1" rx="15" fill="none" stroke="url(#aurora)" stroke-opacity="0.3" />
  
  <g transform="translate(50, 80)">
    <rect class="animate-1 pill" x="0" y="-20" width="160" height="30" />
    <circle class="animate-1 dot" cx="20" cy="-5" r="5" />
    <text class="animate-1 text" x="35" y="0" font-size="14">Open to Collabs</text>

    <text class="animate-2 text" x="0" y="40" font-size="20">Hi there, I'm</text>
    <text class="animate-2 title" x="0" y="90">Fathima Safiya</text>
    
    <text class="animate-3 subtitle" x="0" y="130">Full-Stack Developer</text>
    <text class="animate-3 text" x="0" y="165" font-size="16" fill="#cbd5e1">Building practical applications and solving real-world problems.</text>
  </g>
</svg>
